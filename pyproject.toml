[project]
name = "lending-library"
version = "0.1.0"
description = "Student lending library catalog for Phillips Exeter Academy"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "google-cloud-firestore>=2.19.0",
    "httpx>=0.27.2",
    "jinja2>=3.1.4",
    "python-dotenv>=1.0.1",
    "python-multipart>=0.0.17",
    "uvicorn[standard]>=0.32.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
